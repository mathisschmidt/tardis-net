[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tardis-net-server-app"
version = "0.1.0"
description = "TOTP-gated web console for powering tardis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pyotp>=2.9",
  "qrcode>=7.4",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
tardis-net = "app.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 flags calls in default arguments — which is exactly how FastAPI's
# Depends() / Form() are meant to be written.
ignore = ["B008"]
