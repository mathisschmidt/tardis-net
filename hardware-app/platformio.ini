; tardis-net hardware agent
;
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      watch the log (the setup AP password is printed there)
;
; No external libraries: WiFi, WebServer, HTTPClient and Preferences all ship
; with the Arduino core, and the JSON/crypto the firmware needs live in
; include/. web/portal.html is embedded by the pre-build script below.

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
extra_scripts = pre:tools/build_web_assets.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
check_tool = cppcheck
check_flags = --enable=warning,style --inline-suppr

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev

; A few other boards this firmware runs on unchanged — pick one with
; `pio run -e <name>`. Mind the default GPIO: set it in the portal, not here.
[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1

[env:lolin32_lite]
platform = espressif32@^6.9.0
board = lolin32_lite
