; tardis-net hardware agent
;
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      watch the log (the setup network name is printed there)
;
; WiFi, WebServer, HTTPClient and Preferences ship with the Arduino core.
; WiFiManager (tzapu) owns joining/holding the real network and its own setup
; AP for entering credentials. The JSON/crypto the firmware needs live in
; include/. web/portal.html is embedded by the pre-build script below.

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
extra_scripts = pre:tools/build_web_assets.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
check_tool = cppcheck
check_flags = --enable=warning,style --inline-suppr

[env:lolin32_lite]
platform = espressif32@^6.9.0
board = lolin32
